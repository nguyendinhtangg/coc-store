<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Shop Acc COC</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; background: #111; color: #fff; margin: 0; }
    header { background: #222; text-align: center; padding: 20px; font-size: 24px; color: yellow; }
    .filters { background: #333; padding: 10px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    select { padding: 5px; }
    .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 20px; }
    .card {
      background: #222; border-radius: 10px; width: 300px; padding: 15px; text-align: center;
      border: 1px solid #444;
    }
    .card img { width: 100%; border-radius: 5px; }
    .card h3 { color: #ff5252; margin: 10px 0 5px; }
    .card p { margin: 5px 0; }
    .price { color: #ffe600; font-weight: bold; font-size: 18px; }
    .button { background: yellow; color: black; padding: 10px 15px; display: inline-block; margin-top: 10px; border-radius: 5px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <header>SHOP ACC CLASH OF CLANS</header>
  <div class="filters">
    <label>Loại hall: 
      <select id="hallFilter">
        <option value="all">Tất cả</option>
        <option value="9">Hall 9</option>
        <option value="10">Hall 10</option>
        <option value="11">Hall 11</option>
        <option value="12">Hall 12</option>
        <option value="13">Hall 13</option>
        <option value="14">Hall 14</option>
        <option value="15">Hall 15</option>
        <option value="16">Hall 16</option>
        <option value="17">Hall 17</option>
      </select>
    </label>
    <label>Sắp xếp theo: 
      <select id="sortFilter">
        <option value="newest">Mới đến cũ</option>
        <option value="priceAsc">Giá tăng dần</option>
        <option value="priceDesc">Giá giảm dần</option>
      </select>
    </label>
  </div>
  <div class="container" id="account-list"></div>
  <script src="script.js"></script>
</body>
</html>
